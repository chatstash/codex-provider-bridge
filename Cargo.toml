[package]
name = "codex-provider-bridge"
version = "0.1.0"
edition = "2021"
description = "Local OpenAI-compatible provider bridge for Codex ChatGPT auth mode."

[[bin]]
name = "codex-provider-bridge"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.31"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
