[package]
name = "codex-provider-bridge"
version = "0.1.0"
edition = "2021"
description = "Local OpenAI-compatible provider bridge for Codex ChatGPT auth mode."

[[bin]]
name = "codex-provider-bridge"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
